[project]
name = "vinayak-procurement"
version = "0.1.0"
description = "AI-assisted procurement for a residential developer: site requirement email to structured requirement"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "openai>=3.57.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.4",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
